{
  "slides": [
    {
      "sceneId": "cover",
      "notes": "Open with the promise: one conversation, one file, one clear deliverable per day. Fourteen weeks to launch."
    },
    {
      "sceneId": "how",
      "notes": "Stress that the prompts are pre-written to stay inside the context window. Do not rephrase them."
    },
    {
      "sceneId": "foundation",
      "notes": "The backend exists before Lex gets a voice. Do not skip to Week 3 early."
    },
    {
      "sceneId": "guardrails",
      "notes": "Payment safety and privacy are legal and financial guardrails, not nice-to-haves. Saturday is the only review gate."
    },
    {
      "sceneId": "design",
      "notes": "Remind every session in Weeks 4–5 and 9–10: the main UI is black and white with a single gold accent."
    },
    {
      "sceneId": "frontend",
      "notes": "Week 4 is design-only. Week 5 makes every button real, including the auth flow."
    },
    {
      "sceneId": "payments",
      "notes": "This is the most critical week. Five safety layers stop double charges and failed upgrades."
    },
    {
      "sceneId": "data",
      "notes": "Analytics answers what to fix in Week 15. The law corpus is what makes retrieval credible."
    },
    {
      "sceneId": "mobile",
      "notes": "Week 11 is the last chance to find bugs before production. Ten real contracts, not synthetic ones."
    },
    {
      "sceneId": "launch",
      "notes": "Week 13 switches to live keys only after the Week 6 tests are green. Week 14 is about real users."
    },
    {
      "sceneId": "timeline-a",
      "notes": "First half of the timeline. Each row is one week and one end-of-week deliverable."
    },
    {
      "sceneId": "timeline-b",
      "notes": "Second half of the timeline. Week 14 is the launch week, not another build week."
    },
    {
      "sceneId": "close",
      "notes": "Close on the cadence. One focused session at a time, and the product ships."
    }
  ],
  "slideSequences": []
}
    </script>
