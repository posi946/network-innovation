name: DocuSense frontend

on:
  push:
    branches: [main]
    paths: ['docusense/frontend/**', 'index.html', 'app.js', 'styles.css']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js
      - run: node --check docusense/frontend/lex.js
      - run: npx prettier --check docusense/frontend/lex.js || true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm audit --audit-level=high || true
